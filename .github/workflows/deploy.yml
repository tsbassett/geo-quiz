# Builds the app and publishes it to GitHub Pages every time changes are pushed to main.
# The site appears at https://tsbassett.github.io/geo-quiz/
# (You can also run it by hand from the repository's Actions tab.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what publishing to Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, finish one publish before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install packages (exactly as listed in package-lock.json)
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
